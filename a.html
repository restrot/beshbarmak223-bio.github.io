
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07140d">
  <meta name="description" content="beshbarmak — personal bio and links">
  <title>beshbarmak — Bio</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #07140d;
      --surface: rgba(20, 43, 29, .70);
      --surface-hover: rgba(35, 65, 43, .90);
      --primary: #a8f3ae;
      --text: #e3f4e5;
      --text-secondary: #adc7b1;
      --outline: rgba(174, 226, 184, .16);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans", "Segoe UI", system-ui,
        -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      color: #073919;
      background: var(--primary);
    }

    /* Анимированный лесной фон */

    .wallpaper {
      position: fixed;
      inset: -20%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
      background: radial-gradient(
        ellipse at 50% 42%,
        #102d1a 0%,
        #091a10 44%,
        #050e09 100%
      );
    }

    .orb {
      position: absolute;
      width: 55vw;
      height: 55vw;
      min-width: 320px;
      min-height: 320px;
      border-radius: 48% 52% 63% 37% / 43% 42% 58% 57%;
      filter: blur(65px);
      opacity: .48;
      will-change: transform, border-radius;
      mix-blend-mode: screen;
    }

    .orb-1 {
      left: -8%;
      top: -2%;
      background: #12643b;
      animation: morph-one 23s ease-in-out infinite alternate;
    }

    .orb-2 {
      right: -12%;
      top: 17%;
      background: #397d25;
      opacity: .3;
      animation: morph-two 29s ease-in-out infinite alternate;
    }

    .orb-3 {
      left: 12%;
      bottom: -12%;
      background: #087d62;
      opacity: .34;
      animation: morph-three 25s ease-in-out infinite alternate;
    }

    .orb-4 {
      right: 1%;
      bottom: 2%;
      width: 40vw;
      height: 40vw;
      background: #a0db39;
      opacity: .15;
      filter: blur(95px);
      animation: morph-two 34s ease-in-out infinite alternate-reverse;
    }

    .wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(4, 14, 8, .06),
        rgba(4, 14, 8, .2) 60%,
        rgba(4, 14, 8, .5)
      );
    }

    @keyframes morph-one {
      0% {
        transform: translate(-4%, -2%) rotate(0deg) scale(.9);
        border-radius: 48% 52% 63% 37% / 43% 42% 58% 57%;
      }
      50% {
        border-radius: 62% 38% 43% 57% / 53% 61% 39% 47%;
      }
      100% {
        transform: translate(35%, 24%) rotate(80deg) scale(1.2);
        border-radius: 35% 65% 58% 42% / 60% 40% 60% 40%;
      }
    }

    @keyframes morph-two {
      0% {
        transform: translate(5%, -4%) rotate(0deg) scale(1);
        border-radius: 42% 58% 55% 45% / 51% 42% 58% 49%;
      }
      100% {
        transform: translate(-26%, 23%) rotate(-75deg) scale(1.25);
        border-radius: 65% 35% 38% 62% / 39% 60% 40% 61%;
      }
    }

    @keyframes morph-three {
      0% {
        transform: translate(-10%, 12%) rotate(-20deg) scale(.95);
      }
      100% {
        transform: translate(28%, -20%) rotate(65deg) scale(1.25);
      }
    }

    /* Основная страница */

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 36px, 480px);
      min-height: 100vh;
      margin-inline: auto;
      padding: 38px 0 30px;
      display: flex;
      flex-direction: column;
    }

    /* Профиль */

    .profile {
      text-align: center;
      padding: 24px 0 26px;
      animation: enter 650ms var(--ease) both;
    }

    .avatar-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      overflow: hidden;
      border-radius: 43% 43% 40% 40%;
      border: 2px solid rgba(168, 243, 174, .38);
      background: radial-gradient(
        circle at 30% 20%,
        #367d4b,
        #173e28 48%,
        #0b2013
      );
      box-shadow:
        0 0 0 6px rgba(126, 211, 142, .05),
        0 18px 48px rgba(0, 0, 0, .28);
    }

    .name {
      font-size: clamp(30px, 7vw, 38px);
      line-height: 1.16;
      letter-spacing: -1.1px;
      font-weight: 750;
      color: var(--primary);
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .username {
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 12px;
    }

    .bio {
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
    }

    .arrows {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: 2px;
    }

    /* Карточки ссылок */

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 96px;
      padding: 15px 17px;
      border-radius: 30px;
      border: 1px solid var(--outline);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      backdrop-filter: blur(24px) saturate(125%);
      -webkit-backdrop-filter: blur(24px) saturate(125%);
      box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
      transition:
        transform 320ms var(--ease),
        background 320ms var(--ease),
        border-color 320ms var(--ease),
        box-shadow 320ms var(--ease);
      animation: enter 650ms var(--ease) both;
    }

    .link-card:nth-child(1) {
      animation-delay: 80ms;
    }

    .link-card:nth-child(2) {
      animation-delay: 150ms;
    }

    .link-card:nth-child(3) {
      animation-delay: 220ms;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        115deg,
        rgba(168, 243, 174, .07),
        transparent 48%,
        rgba(168, 243, 174, .025)
      );
      opacity: 0;
      transition: opacity 320ms ease;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.008);
      background: var(--surface-hover);
      border-color: rgba(168, 243, 174, .3);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, .17),
        0 0 28px rgba(75, 167, 92, .05);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card:active {
      transform: scale(.975);
    }

    .link-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 4px;
    }

    .link-icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 21px;
      color: var(--primary);
      background: rgba(90, 155, 99, .19);
      transition:
        border-radius 320ms var(--ease),
        background 320ms ease,
        transform 320ms var(--ease);
    }

    .link-card:hover .link-icon {
      border-radius: 17px;
      background: rgba(90, 155, 99, .3);
      transform: rotate(-3deg);
    }

    .link-icon svg {
      width: 27px;
      height: 27px;
      display: block;
    }

    .link-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .link-title {
      font-size: 17px;
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: -.2px;
    }

    .link-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .link-arrow {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(105, 177, 115, .1);
      color: var(--primary);
      transition:
        transform 320ms var(--ease),
        background 320ms ease;
    }

    .link-arrow svg {
      width: 21px;
      height: 21px;
    }

    .link-card:hover .link-arrow {
      transform: translateX(3px);
      background: rgba(105, 177, 115, .2);
    }

    /* Появление страницы */

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Мобильные устройства */

    @media (max-width: 420px) {
      .page {
        width: calc(100% - 30px);
        padding-top: 22px;
      }

      .avatar-wrap {
        width: 124px;
        height: 124px;
      }

      .link-card {
        min-height: 86px;
        padding: 13px;
        gap: 12px;
        border-radius: 26px;
      }

      .link-icon {
        width: 49px;
        height: 49px;
        border-radius: 18px;
      }

      .link-title {
        font-size: 16px;
      }

      .link-subtitle {
        font-size: 12px;
      }

      .link-arrow {
        width: 37px;
        height: 37px;
      }

      .orb {
        filter: blur(55px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
